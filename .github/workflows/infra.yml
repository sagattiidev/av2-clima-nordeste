name: Infra - Provisionar Aiven (Terraform)

# O apply é manual. Alterações de infraestrutura na main executam apenas o plan.
# IMPORTANTE: GitHub runners sao efemeros; para reaplicar, configure backend de state.
on:
  push:
    branches: [main]
    paths:
      - 'terraform/**'
      - '.github/workflows/infra.yml'
  workflow_dispatch:
    inputs:
      operation:
        description: "validate verifica o código, plan consulta Aiven, apply cria o PostgreSQL gratuito"
        type: choice
        default: validate
        options: [validate, plan, apply]

permissions:
  contents: read

concurrency:
  group: aiven-terraform
  cancel-in-progress: false

env:
  TF_VAR_aiven_api_token: ${{ secrets.AIVEN_API_TOKEN }}
  TF_VAR_aiven_project: ${{ secrets.AIVEN_PROJECT }}
  TF_VAR_pg_plan: free-1-1gb
  TF_VAR_enable_kafka: "false"
  TF_VAR_enable_grafana: "false"

jobs:
  terraform:
    name: Terraform validate/plan/apply
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Conferir credenciais da Aiven
        if: github.event_name == 'push' || inputs.operation == 'plan' || inputs.operation == 'apply'
        run: |
          if [[ -z "$TF_VAR_aiven_api_token" || -z "$TF_VAR_aiven_project" ]]; then
            echo "::error::Cadastre AIVEN_API_TOKEN e AIVEN_PROJECT."
            exit 1
          fi

      - name: Terraform Plan
        if: github.event_name == 'push' || inputs.operation == 'plan' || inputs.operation == 'apply'
        run: terraform plan -input=false -out=tfplan

      - name: Terraform Apply
        if: inputs.operation == 'apply' && github.ref == 'refs/heads/main'
        run: terraform apply -input=false tfplan
